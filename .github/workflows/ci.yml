name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: Type check (mypy, strict)
        run: mypy

      - name: Tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Build the distribution
        run: |
          python -m pip install --upgrade build
          python -m build
          python -m pip install --upgrade twine
          twine check dist/*

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Audit dependencies
        # Informational: a newly published advisory should not break the build
        # for everyone, but it must be visible in the run summary.
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit --progress-spinner=off | tee audit.txt

      - name: Publish audit result
        if: always()
        run: cat audit.txt >> "$GITHUB_STEP_SUMMARY"
